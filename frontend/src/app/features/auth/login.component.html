<div class="auth-page">
  <form class="auth-form tava-form tava-card" (ngSubmit)="submit()">
    <h1 class="tava-glow-text">Ingresar</h1>
    <p>Accede a tus boletas y colección TAVA</p>
    <label>
      Correo
      <input type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
    </label>
    <label>
      Contraseña
      <input type="password" [(ngModel)]="password" name="password" required />
    </label>
    <tava-captcha (tokenChange)="onCaptchaToken($event)" />
    <button type="submit" class="tava-btn-primary" [disabled]="submitting">Entrar</button>
    <p class="hint"><a routerLink="/olvide-contrasena">¿Olvidaste tu contraseña?</a></p>
    @if (needsVerification) {
      <p class="hint warn">Debes verificar tu correo antes de ingresar. Revisa tu bandeja y spam.</p>
      <button type="button" class="link-btn" [disabled]="resending" (click)="resendVerification()">
        Reenviar correo de verificación
      </button>
    }
    <p class="hint">¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
  </form>
</div>
