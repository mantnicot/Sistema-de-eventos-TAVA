<div class="auth-page">
  <div class="auth-form tava-form tava-card">
    <h1 class="tava-glow-text">¿Olvidaste tu contraseña?</h1>
    @if (!sent) {
      <p>Te enviaremos un enlace seguro a tu correo.</p>
      <label>
        Correo registrado
        <input type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
      </label>
      <button type="button" class="tava-btn-primary" (click)="submit()">Enviar enlace</button>
    } @else {
      <p class="ok-msg">Revisa tu bandeja y spam. El enlace expira en pocas horas.</p>
    }
    <a routerLink="/ingresar" class="hint">Volver a ingresar</a>
  </div>
</div>
