<div class="auth-page">
  <div class="auth-form tava-form tava-card">
    <h1 class="tava-glow-text">Nueva contraseña</h1>
    @if (!ok && token) {
      <p>Elige una contraseña segura (mínimo 8 caracteres).</p>
      <label>
        Nueva contraseña
        <input type="password" [(ngModel)]="password" name="password" required minlength="8" />
      </label>
      <label>
        Confirmar contraseña
        <input type="password" [(ngModel)]="password2" name="password2" required minlength="8" />
      </label>
      <button type="button" class="tava-btn-primary" (click)="submit()">Guardar contraseña</button>
    } @else if (ok) {
      <p class="ok-msg">Contraseña actualizada. Redirigiendo al login…</p>
    } @else {
      <p class="hint warn">Enlace inválido o expirado.</p>
      <a routerLink="/olvide-contrasena" class="tava-btn-primary">Solicitar nuevo enlace</a>
    }
    <a routerLink="/ingresar" class="hint">Volver a ingresar</a>
  </div>
</div>
