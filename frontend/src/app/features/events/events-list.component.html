<section class="page-header page-header--broadway">
  <div>
    <h1 class="tava-glow-text">Cartelera de eventos</h1>
    <p>Selecciona tu función y asegura tu lugar — estilo gran teatro.</p>
  </div>
</section>

<div class="filters tava-card">
  <input type="search" placeholder="Buscar obra, artista o ciudad…" [(ngModel)]="search" (keyup.enter)="load()" />
  <input type="text" placeholder="Categoría (ej. Teatro)" [(ngModel)]="category" (keyup.enter)="load()" />
  <button type="button" class="tava-btn-primary" (click)="load()">Buscar</button>
</div>

<div class="show-grid">
  @for (ev of events(); track ev.id) {
    <article class="show-card tava-card">
      <a [routerLink]="['/eventos', ev.id]" class="show-card__link">
        <div class="show-card__img" [style.backgroundImage]="'url(' + mediaUrl(ev.main_image_url) + ')'"></div>
        <div class="show-card__body">
          <span class="show-card__cat">{{ ev.category }}</span>
          <h2>{{ ev.name }}</h2>
          <p class="show-card__meta">{{ ev.city }} · {{ ev.event_date }}</p>
          <span class="show-card__cta tava-btn-primary">Ver boletas</span>
        </div>
      </a>
    </article>
  } @empty {
    <p class="empty">No hay funciones publicadas. Vuelve pronto.</p>
  }
</div>
