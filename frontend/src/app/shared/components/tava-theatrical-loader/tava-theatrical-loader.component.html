<div class="theatrical-loader" role="status" aria-live="polite" aria-busy="true">
  <div class="theatrical-loader__scene" aria-hidden="true">
    <div class="theatrical-loader__sky"></div>
    <div class="theatrical-loader__theater">
      <div class="theatrical-loader__roof"></div>
      <div class="theatrical-loader__columns">
        <span></span><span></span>
      </div>
      <div class="theatrical-loader__stage">
        <div class="theatrical-loader__curtain theatrical-loader__curtain--l"></div>
        <div class="theatrical-loader__curtain theatrical-loader__curtain--r"></div>
      </div>
      <div class="theatrical-loader__bricks">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="theatrical-loader__builder">
      <span class="theatrical-loader__person">🧑‍🔧</span>
      <span class="theatrical-loader__tool">🔨</span>
    </div>
    <div class="theatrical-loader__dust">
      <span></span><span></span><span></span>
    </div>
  </div>
  <h2 class="theatrical-loader__title">{{ title }}</h2>
  <p class="theatrical-loader__message">{{ currentMessage() }}</p>
</div>
