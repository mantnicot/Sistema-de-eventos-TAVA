<div class="theatrical-loader" role="status" aria-live="polite" aria-busy="true">
  <div class="theatrical-loader__scene" [class.theatrical-loader__scene--fallback]="videoFailed()" aria-hidden="true">
    <div class="theatrical-loader__fallback">
      <span>TAVA</span>
    </div>
    @if (resolvedVideoSrc()) {
      <video
        #loaderVideo
        class="theatrical-loader__video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        [src]="resolvedVideoSrc()"
        (loadeddata)="onVideoReady()"
        (canplay)="onVideoReady()"
        (playing)="onVideoPlaying()"
        (error)="onVideoError()"
      ></video>
    }
  </div>
  <h2 class="theatrical-loader__title">{{ title }}</h2>
  <p class="theatrical-loader__message">{{ currentMessage() }}</p>
</div>
