<div class="tavo-chat" [class.tavo-chat--open]="open()">
  @if (showHint() && !open()) {
    <button type="button" class="tavo-chat__hint" (click)="toggle()" aria-label="Abrir Tavo">
      ¿Dudas?
    </button>
  }

  @if (open()) {
    <section class="tavo-chat__panel" role="dialog" aria-label="Chat con Tavo">
      <header class="tavo-chat__head">
        <img [src]="avatarUrl" alt="" width="40" height="40" class="tavo-chat__avatar" />
        <div>
          <strong>Tavo</strong>
          <span>Asistente de TAVA</span>
        </div>
        <button type="button" class="tavo-chat__wa-head" (click)="openWhatsappAlways()" title="WhatsApp">
          WA
        </button>
        <button type="button" class="tavo-chat__close" (click)="close()" aria-label="Cerrar chat">×</button>
      </header>

      <div class="tavo-chat__messages">
        @for (m of messages(); track trackMsg($index, m)) {
          <article class="tavo-chat__bubble" [class.tavo-chat__bubble--user]="m.from === 'user'">
            <p>
              {{ m.text }}@if (showCaret(m)) {
                <span class="tavo-chat__caret" aria-hidden="true"></span>
              }
            </p>
            @if (m.buttons?.length) {
              <div class="tavo-chat__actions">
                @for (b of m.buttons; track b.label) {
                  <button type="button" class="tavo-chat__chip" (click)="onButton(b)" [disabled]="busy()">
                    {{ b.label }}
                  </button>
                }
              </div>
            }
          </article>
        }
        @if (typing()) {
          <article class="tavo-chat__bubble tavo-chat__bubble--typing" aria-live="polite">
            <span class="tavo-chat__dots"><i></i><i></i><i></i></span>
            <span class="tavo-chat__typing-label">Tavo está escribiendo…</span>
          </article>
        }
      </div>

      <footer class="tavo-chat__foot">
        <button type="button" class="tavo-chat__wa-bar" (click)="openWhatsappAlways()">
          💬 WhatsApp en cualquier momento
        </button>
        <form class="tavo-chat__compose" (submit)="$event.preventDefault(); sendText()">
          <input
            type="text"
            [ngModel]="draft()"
            (ngModelChange)="draft.set($event)"
            name="tavoDraft"
            placeholder="Escribe tu duda…"
            maxlength="400"
            autocomplete="off"
            [disabled]="busy()"
          />
          <button type="submit" class="tavo-chat__send" [disabled]="busy() || !draft().trim()">Enviar</button>
        </form>
      </footer>
    </section>
  }

  <button
    type="button"
    class="tavo-chat__toggle"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-label="Abrir asistente Tavo"
  >
    <img [src]="avatarUrl" alt="Tavo" width="48" height="48" />
  </button>
</div>
