# Mantiene despiertos Render y Neon (Neon free duerme ~5 min sin consultas SQL).
name: API keep-alive

on:
  schedule:
    # Cada 4 minutos (UTC) — Neon free duerme ~5 min sin SQL
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API Render
        run: |
          set +e
          echo "Ping $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl -fsS --retry 1 --retry-delay 3 -m 45 \
            "https://tava-api-1.onrender.com/health/db" \
            -o /dev/null -w "ping: %{http_code}\n" || true
          exit 0
